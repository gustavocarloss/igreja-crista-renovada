name: Supabase Keep Alive

on:
  schedule:
    # Todo dia às 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY não configurados."
            exit 1
          fi
          # Chama a função keep_alive() (criada em supabase-security.sql): consulta o banco
          # sem precisar liberar nenhuma tabela para quem não está logado.
          curl --fail --silent --show-error -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Supabase ping OK"
